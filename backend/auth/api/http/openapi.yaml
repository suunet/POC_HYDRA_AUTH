openapi: "3.0.0"
info:
  version: 1.0.0
  title: Auth
  description: |
    auth-service の公開API。エラーレスポンスは RFC 9457（NFR-06・application/problem+json）。
paths:
  /auth/register:
    post:
      summary: アカウントを登録する
      operationId: registerAccount
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccountRequest'
      responses:
        '201':
          description: 登録を受け付けた（FR-01・メールアドレス重複時も同一応答＝列挙攻撃対策）
        '400':
          description: バリデーションエラー（VAR-01/VAR-02違反・E1/E2）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/validation-error
                title: Bad Request
                status: 400
        '429':
          description: 登録レートリミット超過（VAR-16・E4。登録済み/未登録に関わらず一様挙動。retry_afterはTTL残秒数）
          headers:
            Retry-After:
              description: 再試行までの秒数（bodyのretry_afterと同値）
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/rate-limit-exceeded
                title: Too Many Requests
                status: 429
                retry_after: 287
        '503':
          description: メール送信失敗（E3。登録・トークン保存はロールバック済み）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/mail-delivery-error
                title: Service Unavailable
                status: 503
  /auth/login:
    post:
      summary: ログインする
      operationId: login
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功（UC-005・STM-02.認証済み。アクセストークン〔JWT RS256〕とリフレッシュトークンを返す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTokens'
        '400':
          description: メールアドレス形式不正（E1=validation-error）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/validation-error
                title: Bad Request
                status: 400
        '401':
          description: 認証失敗（E3=ユーザー不存在・E4=パスワード不一致。列挙防止のため同一応答）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/authentication-failed
                title: Unauthorized
                status: 401
        '403':
          description: メール未確認（E5=email-not-verified）または無効化済み（E6=account-disabled）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/email-not-verified
                title: Forbidden
                status: 403
        '429':
          description: ロックアウト中（E2・NFR-03。10回失敗で15分・retry_afterは解除までの秒数・VAR-11）
          headers:
            Retry-After:
              description: 解除までの秒数（bodyのretry_afterと同値）
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/account-locked
                title: Too Many Requests
                status: 429
                error_code: account_locked
                retry_after: 780
  /auth/token/refresh:
    post:
      summary: トークンを再発行する
      operationId: refreshToken
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 再発行成功（UC-006・ローテーション。新アクセストークン〔JWT RS256〕と新リフレッシュトークンを返す）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTokens'
        '401':
          description: |
            トークン検証失敗。E1/E2=invalid-token（形式不正・不存在）／E3=token-expired（期限切れ）／
            E4=session-revoked〔token_reuse_detected・当該family一括失効〕／E5/E6=session-revoked〔account_deleted/account_disabled〕
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/session-revoked
                title: Unauthorized
                status: 401
                revocation_reason: token_reuse_detected
  /auth/logout:
    post:
      summary: ログアウトする
      operationId: logout
      tags:
        - commands
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: ログアウトを受け付けた（UC-007・FR-07。当該RT1本のみ失効・冪等＝不存在/既失効/期限切れ/使用済みでも200。所有者不一致でも200〔情報漏洩防止〕）
        '400':
          description: リフレッシュトークン形式不正（E1=validation-error。資格情報はATのためRTは入力バリデーション扱い）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/validation-error
                title: Bad Request
                status: 400
        '401':
          description: アクセストークン検証失敗（M1・FR-19。欠落/形式不正/署名不正/期限切れを区別せず一様）
          headers:
            WWW-Authenticate:
              description: FR-19ミドルウェア経由の401では常に "Bearer"（RFC 6750）
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/invalid-token
                title: Unauthorized
                status: 401
  /auth/password:
    put:
      summary: パスワードを変更する
      operationId: changePassword
      tags:
        - commands
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: パスワード変更完了（UC-010・FR-10。当該ユーザーの全リフレッシュトークンを失効し再ログインを要求）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeResponse'
        '400':
          description: 新パスワード強度不足（E1=validation-error・VAR-02〔15〜64文字・UTF-8で72バイト以下〕）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/validation-error
                title: Bad Request
                status: 400
        '401':
          description: |
            アクセストークン検証失敗（M1・FR-19=invalid-token・一様）／
            削除済み・無効化済みアカウント（E4/E5=session-revoked＋revocation_reason〔account_deleted/account_disabled〕・トークン状態は変更しない）
          headers:
            WWW-Authenticate:
              description: FR-19ミドルウェア経由の401では常に "Bearer"（RFC 6750）
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/session-revoked
                title: Unauthorized
                status: 401
                revocation_reason: account_deleted
        '403':
          description: 現在のパスワード不一致（E2=password-mismatch・CND-16。401はJWT認証失敗と区別）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/password-mismatch
                title: Forbidden
                status: 403
        '500':
          description: トランザクション失敗（E3=internal-error・全ロールバック済み）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/internal-error
                title: Internal Server Error
                status: 500
  /auth/email-verify:
    post:
      summary: メールアドレスを確認する
      operationId: verifyEmail
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequest'
      responses:
        '200':
          description: メールアドレスを確認した（UC-003・STM-01 mail_unverified→inactive・トークンは使い切り）
        '400':
          description: 無効・使用済みトークン（E1a/E1b=invalid-token・状態を区別しない）または期限切れ（E2=token-expired・CND-09不成立）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/invalid-token
                title: Bad Request
                status: 400
        '429':
          description: メール確認レートリミット超過（VAR-17・E4。IP単位・retry_afterはTTL残秒数）
          headers:
            Retry-After:
              description: 再試行までの秒数（bodyのretry_afterと同値）
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/rate-limit-exceeded
                title: Too Many Requests
                status: 429
                retry_after: 42
  /auth/email-verify/resend:
    post:
      summary: メール確認トークンを再送する
      operationId: resendEmailVerification
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyResendRequest'
      responses:
        '200':
          description: 受け付けた（UC-004・FR-04＝未登録/確認済みでも一律200・メール送信なし）。STM-01は不変（mail_unverifiedのまま）
        '429':
          description: 再送信レートリミット超過（VAR-13・E1。メールキー・一様適用・retry_afterはTTL残秒数）
          headers:
            Retry-After:
              description: 再試行までの秒数（bodyのretry_afterと同値）
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/rate-limit-exceeded
                title: Too Many Requests
                status: 429
                retry_after: 240
        '503':
          description: メール送信失敗（E2。新トークン発行・既存無効化はロールバック済み。ただしレート窓は消費）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/mail-delivery-error
                title: Service Unavailable
                status: 503
  /auth/password-reset:
    post:
      summary: パスワードリセットを要求する
      operationId: requestPasswordReset
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: 受け付けた（UC-008・FR-08＝未登録/不適格〔inactive以外〕でも一律200・メール送信なし・ボディ最小限で成功時と区別しない）。適格時はSTM-03.パスワードリセット中へ
        '400':
          description: メールアドレス形式不正（VAR-01・E1。レート判定・記録はこの前に一様に確定済み＝VAR-12①）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/validation-error
                title: Bad Request
                status: 400
        '429':
          description: リセット要求レートリミット超過（VAR-12・E2。メールキー・存在/状態に依らず一様・retry_afterはTTL残秒数）
          headers:
            Retry-After:
              description: 再試行までの秒数（bodyのretry_afterと同値）
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/rate-limit-exceeded
                title: Too Many Requests
                status: 429
                retry_after: 240
        '503':
          description: リセットメール送信失敗（E3。既存トークン無効化・新トークン保存は全ロールバック済み＝旧有効トークンが残る。ただしレート窓は消費）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/mail-delivery-error
                title: Service Unavailable
                status: 503
  /auth/password-reset/confirm:
    post:
      summary: パスワードリセットを完了する
      operationId: confirmPasswordReset
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: パスワード再設定完了（UC-009・FR-09。単一Txで当該トークン消費＋他の有効トークン一括無効化〔CND-18〕＋全リフレッシュトークン失効〔password_changed〕。事後STM-01.未認証＝アカウント状態不変・ボディ最小限）
        '400':
          description: 強度不足（E4=validation-error・VAR-02）／トークン不存在・使用済み（E5/E6=invalid-token・応答同一で状態を区別しない）／期限切れ（E7=token-expired・CND-08・状態更新なしno-op）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/invalid-token
                title: Bad Request
                status: 400
        '500':
          description: トランザクション失敗（E8=internal-error・パスワード・トークン状態・セッションとも全ロールバック済み）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/internal-error
                title: Internal Server Error
                status: 500
  /admin/invitations:
    post:
      summary: 管理者を招待する
      operationId: inviteAdmin
      tags:
        - commands
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInvitationRequest'
      responses:
        '200':
          description: 招待メールを送信した（UC-011・FR-11。再招待時は既存有効トークンを無効化=FR-12・CND-19。事後の「招待済み未受付」はINF-07の有効未使用トークンの存在で表す=STM-01遷移なし）
        '400':
          description: メールアドレス形式不正（E1・VAR-01）または無効なロール指定（E2・VAR-09）。パース不能メールはバインド検証が一律400で先行（variations.md共通注記）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/validation-error
                title: Bad Request
                status: 400
        '401':
          description: アクセストークン検証失敗（M1・FR-19一様）
          headers:
            WWW-Authenticate:
              description: Bearer チャレンジ
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/invalid-token
                title: Unauthorized
                status: 401
        '403':
          description: super_admin ロール不足（M2・CND-17 OR評価）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/forbidden
                title: Forbidden
                status: 403
        '409':
          description: 管理者ロール付与済み（E4=role-already-assigned・CND-11）または既存アカウント実在（E6=email-already-registered・招待時遮断＝管理者化はBUC-A07経路）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/role-already-assigned
                title: Conflict
                status: 409
        '429':
          description: 招待リクエストレートリミット超過（E3・VAR-14。メールキー・一様適用・retry_afterはTTL残秒数）
          headers:
            Retry-After:
              description: 再試行までの秒数（bodyのretry_afterと同値）
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/rate-limit-exceeded
                title: Too Many Requests
                status: 429
                retry_after: 240
        '503':
          description: 招待メール送信失敗（E5。既存トークン無効化・新トークン保存は全ロールバック済み＝旧有効トークンが残る。ただしレート窓は消費）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/mail-delivery-error
                title: Service Unavailable
                status: 503
  /auth/invitation/accept:
    post:
      summary: 招待を受け付ける
      operationId: acceptInvitation
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
      responses:
        '200':
          description: 管理者アカウント作成完了（UC-012・FR-13。単一Txでユーザー作成〔未認証〕＋紐付けロール付与＋トークン消費＋他有効トークン一括無効化〔CND-19〕。認証は行わずUC-005でログイン）
        '400':
          description: 強度不足（E1=validation-error・VAR-02）／トークン不存在・使用済み（E2/E3=invalid-token・応答同一で状態を区別しない）／期限切れ（E4=token-expired・CND-12・状態更新なしno-op）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/invalid-token
                title: Bad Request
                status: 400
        '409':
          description: 既存アカウント実在（E6=email-already-registered・招待発行〜受付間の自己登録レース対策・トークン非消費・500にしない）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/email-already-registered
                title: Conflict
                status: 409
        '500':
          description: トランザクション失敗（E5=internal-error・ユーザー作成/ロール付与/トークン状態とも全ロールバック済み）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://example.com/probs/internal-error
                title: Internal Server Error
                status: 500
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: アクセストークン（INF-03・JWT RS256）。検証はFR-19ミドルウェア（失敗は401一様）
  schemas:
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          description: 現在のパスワード（CND-16照合用。形式検証はしない＝照合失敗として403へ）
        new_password:
          type: string
          minLength: 15
          maxLength: 64
          description: VAR-02（最小15・最大64文字・Unicode許容・UTF-8で72バイト以下）
    PasswordChangeResponse:
      type: object
      required:
        - revocation_reason
      properties:
        revocation_reason:
          type: string
          description: 常に password_changed（VAR-10・FR-10。クライアントの再ログイン誘導用。他フィールドなし）
    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: 失効させるopaqueリフレッシュトークン（平文。INF-04はSHA-256ハッシュのみ保存し照合する・UC-007）
    RegisterAccountRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: VAR-01（RFC5322準拠・最大254文字）
        password:
          type: string
          minLength: 15
          maxLength: 64
          description: VAR-02（最小15文字・最大64文字・文字種の混在強制なし）
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: VAR-01（RFC5322準拠・最大254文字）
        password:
          type: string
          description: 認証用パスワード（照合はbcrypt・CND-02）
    LoginTokens:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
          description: JWT（RS256・INF-03）。sub/roles/exp（VAR-03=15分）クレームを含む
        refresh_token:
          type: string
          description: opaque token（INF-04・NFR-14。base64url。DBにはSHA-256ハッシュのみ保存）
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: opaque リフレッシュトークン（平文。INF-04はSHA-256ハッシュのみ保存し照合する・UC-006）
    EmailVerifyResendRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: VAR-01（RFC5322準拠・最大254文字）
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: VAR-01（RFC5322準拠・最大254文字）
    InvitationAcceptRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 1
          description: 招待トークン（平文。INF-07はSHA-256ハッシュのみ保存し照合する）
        password:
          type: string
          minLength: 15
          maxLength: 64
          description: VAR-02（最小15・最大64文字・Unicode許容・UTF-8で72バイト以下）
    AdminInvitationRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: VAR-01（RFC5322準拠・最大254文字）
        role:
          type: string
          minLength: 1
          description: VAR-09（`super_admin`・`operator`・`system_admin` のいずれか。判定はUseCase層のE2）
    PasswordResetConfirmRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          minLength: 1
          description: パスワードリセットトークン（平文。INF-05はSHA-256ハッシュのみ保存し照合する）
        new_password:
          type: string
          minLength: 15
          maxLength: 64
          description: VAR-02（最小15・最大64文字・Unicode許容・UTF-8で72バイト以下）
    EmailVerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          description: メール確認トークン（平文。INF-06はSHA-256ハッシュのみ保存し照合する）
    Problem:
      type: object
      description: RFC 9457 Problem Details（NFR-06）。retry_after・revocation_reason は拡張フィールド
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: VAR-15のベースURI配下（例 https://example.com/probs/validation-error）
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        retry_after:
          type: integer
          description: レート制限・ロックアウト超過時の再試行可能秒数（E4・VAR-11）
        error_code:
          type: string
          description: 拡張エラーコード（VAR-11＝account_locked 等）
        revocation_reason:
          type: string
          description: セッション失効理由コード（VAR-10・UC-006の401 session-revokedで使用＝token_reuse_detected/account_deleted/account_disabled）
